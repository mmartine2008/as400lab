
services:

  db:
    image: postgres:16-alpine
    container_name: ibmi-lab-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - ibmi_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab:
    build:
      context: .

    container_name: ibmi-lab

    depends_on:
      db:
        condition: service_healthy

    working_dir: /opt/ibmi-lab

    volumes:
      - .:/opt/ibmi-lab

    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires

    stdin_open: true
    tty: true

volumes:
  ibmi_data:

